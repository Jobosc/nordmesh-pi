name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        # --extra cloudflare pulls in PyJWT so the Cloudflare Access
        # signature-verification tests run instead of being skipped.
        run: uv sync --group dev --extra cloudflare

      - name: Run tests
        run: uv run pytest
