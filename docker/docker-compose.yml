services:
  nordvpn-meshnet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nordvpn-meshnet
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      HOST: "0.0.0.0"
      PORT: "${PORT:-5000}"
    volumes:
      # Persist NordVPN login state and config across container restarts
      - nordvpn-data:/var/lib/nordvpn
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${PORT:-5000}/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  nordvpn-data:
