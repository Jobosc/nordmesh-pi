services:
  nordvpn-meshnet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nordvpn-meshnet
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      HOST: "0.0.0.0"
      PORT: "${PORT:-5000}"
      NORDVPN_CONNECT_ATTEMPTS: "${NORDVPN_CONNECT_ATTEMPTS:-5}"
      NORDVPN_CONNECT_RETRY_DELAY_MS: "${NORDVPN_CONNECT_RETRY_DELAY_MS:-3000}"
      # Who may embed the UI in an iframe (your Home Assistant origin).
      ALLOWED_FRAME_ANCESTORS: "${ALLOWED_FRAME_ANCESTORS:-*}"
      # Set both to make the app verify Cloudflare Access tokens itself.
      CF_ACCESS_TEAM_DOMAIN: "${CF_ACCESS_TEAM_DOMAIN:-}"
      CF_ACCESS_AUD: "${CF_ACCESS_AUD:-}"
    volumes:
      # Persist NordVPN login state and config across container restarts
      - nordvpn-data:/var/lib/nordvpn
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${PORT:-5000}/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional: expose the UI over HTTPS through a Cloudflare Tunnel.
  # Start with:  docker compose --profile cloudflare up -d
  # Create the tunnel in Zero Trust -> Networks -> Tunnels, point its public
  # hostname at http://nordvpn-meshnet:5000, and put the token in .env as
  # CLOUDFLARE_TUNNEL_TOKEN. No ports need opening on your router.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nordmesh-cloudflared
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in docker/.env}"
    depends_on:
      - nordvpn-meshnet
    restart: unless-stopped

volumes:
  nordvpn-data:
